<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台股查詢</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial@0.2.1/dist/chartjs-chart-financial.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>台股查詢</h1>
            <p class="subtitle">Yahoo Finance 股價資料與技術指標圖</p>
        </header>

        <div class="search-section">
            <div class="search-box">
                <input type="text" id="stockSymbol" placeholder="輸入股票代號，例如 2330" maxlength="6">
                <button id="searchBtn">查詢</button>
            </div>
            <div class="search-tips">
                <span>熱門代號：</span>
                <button class="quick-btn" data-symbol="2330">2330 台積電</button>
                <button class="quick-btn" data-symbol="0050">0050 元大台灣50</button>
                <button class="quick-btn" data-symbol="6488">6488 環球晶</button>
            </div>
        </div>

        <div id="errorMessage" class="error-message" style="display: none;"></div>

        <div id="loading" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p>載入中...</p>
        </div>

        <div id="stockInfo" class="stock-info" style="display: none;">
            <div class="info-card">
                <div class="stock-header">
                    <div class="stock-name-section">
                        <h2 id="stockName">-</h2>
                        <span id="stockSymbolDisplay" class="stock-tag">-</span>
                        <span id="stockMarket" class="market-badge">-</span>
                    </div>
                    <div class="price-section">
                        <span id="stockPrice" class="price">-</span>
                        <span id="stockChange" class="change">-</span>
                        <span id="stockChangePercent" class="change-percent">-</span>
                    </div>
                </div>
                <div class="stock-details">
                    <div class="detail-item">
                        <span class="label">開盤</span>
                        <span id="stockOpen" class="value">-</span>
                    </div>
                    <div class="detail-item">
                        <span class="label">最高</span>
                        <span id="stockHigh" class="value">-</span>
                    </div>
                    <div class="detail-item">
                        <span class="label">最低</span>
                        <span id="stockLow" class="value">-</span>
                    </div>
                    <div class="detail-item">
                        <span class="label">成交量</span>
                        <span id="stockVolume" class="value">-</span>
                    </div>
                </div>
            </div>

            <div class="chart-section">
                <div class="chart-header">
                    <h3>K 線圖</h3>
                    <div class="range-buttons">
                        <button class="range-btn" data-range="1mo">1個月</button>
                        <button class="range-btn" data-range="3mo">3個月</button>
                        <button class="range-btn active" data-range="6mo">6個月</button>
                        <button class="range-btn" data-range="1y">1年</button>
                        <button class="range-btn" data-range="5y">5年</button>
                    </div>
                </div>
                <div class="ma-toggle-bar">
                    <label><input type="checkbox" class="ma-toggle" value="ma5" checked> MA5</label>
                    <label><input type="checkbox" class="ma-toggle" value="ma10" checked> MA10</label>
                    <label><input type="checkbox" class="ma-toggle" value="ma20" checked> MA20</label>
                    <label><input type="checkbox" class="ma-toggle" value="ma60" checked> MA60</label>
                </div>
                <div class="chart-container">
                    <canvas id="candlestickChart"></canvas>
                </div>
                <div id="chartError" class="chart-error" style="display: none;"></div>
            </div>

            <div class="volume-section">
                <div class="chart-header">
                    <h3>成交量</h3>
                </div>
                <div class="chart-container volume-chart-container">
                    <canvas id="volumeChart"></canvas>
                </div>
            </div>

            <div class="indicator-section">
                <div class="chart-header">
                    <h3>ATR</h3>
                </div>
                <div class="chart-container indicator-chart-container">
                    <canvas id="atrChart"></canvas>
                </div>
            </div>

            <div class="indicator-section">
                <div class="chart-header">
                    <h3>RSI</h3>
                </div>
                <div class="chart-container indicator-chart-container">
                    <canvas id="rsiChart"></canvas>
                </div>
            </div>

            <div class="indicator-section">
                <div class="chart-header">
                    <h3>MACD</h3>
                </div>
                <div class="chart-container indicator-chart-container">
                    <canvas id="macdChart"></canvas>
                </div>
            </div>

            <div class="indicator-section">
                <div class="chart-header">
                    <h3>KDJ</h3>
                </div>
                <div class="chart-container indicator-chart-container">
                    <canvas id="kdjChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
